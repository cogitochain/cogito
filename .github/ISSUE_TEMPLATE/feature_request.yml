name: Feature request
description: Propose a change to the mind format, the generator, the measurements or the patch stack.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The change you propose
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Effect on compute units
      description: If the change touches the programs, how it changes the CU of one thought and how you measured it.
