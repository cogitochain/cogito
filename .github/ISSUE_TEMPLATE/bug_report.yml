name: Bug report
description: Something in the generator, the reference computation, the patches or the VM harness does not behave as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and its full output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: signature
    attributes:
      label: Transaction signature, slot and time
      description: If this is about a thought on the network, its signature, its slot and the time in UTC. The node keeps only a few hours of transactions; with the slot and time we find the site's own record of it.
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, CPU (does it have AVX-512?), Python, numpy and Rust versions.
    validations:
      required: true
